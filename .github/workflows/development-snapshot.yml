name: Development snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/development-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Capture tracked source and history without legacy recovery payloads
        run: |
          mkdir -p /tmp/tickets-snapshot
          git archive HEAD | tar -x -C /tmp/tickets-snapshot
          git bundle create /tmp/tickets-snapshot/history.bundle --all
          git rev-parse HEAD > /tmp/tickets-snapshot/SNAPSHOT_SHA
          tar -C /tmp/tickets-snapshot -czf /tmp/tickets-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: tickets-source-snapshot
          path: /tmp/tickets-snapshot.tar.gz
          retention-days: 2
