name: Approve visual evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/approve-visual-evidence.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: approve-visual-evidence
  cancel-in-progress: false
jobs:
  approve:
    if: github.repository == 'alex-mextner/tickets-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '10161566659'
          run-id: '34500249422'
          github-token: ${{ github.token }}
          path: /tmp/tickets-reviewed-evidence
          merge-multiple: true
      - name: Verify exactly the five images inspected from the successful E2E run
        run: |
          bun - <<'JS'
          import {readFileSync, mkdirSync, writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root='/tmp/tickets-reviewed-evidence';
          const sourceCommit='8c3d8b9e46f69e40d2eee92aabd61262e72f57ed';
          if(readFileSync(`${root}/reports/TESTED_SHA`,'utf8').trim()!==sourceCommit) throw new Error('Wrong tested commit');
          if(!readFileSync(`${root}/reports/RESULTS`,'utf8').includes('e2e=success')) throw new Error('E2E did not pass');
          const sha256={
            'issues-dark-visual.png':'99ac3cf09c5f028d31a05eb2b9170cf545116a491d98f7b4d38906de135d18db',
            'board-dark-visual.png':'7d4aefcf3bcde72457412d86acbf66a37b544d112ff5ba55a903a049441656e9',
            'issue-detail-visual.png':'909a25ba3df60dd1b30348407649444e42236581948a819c722b82f614326a1d',
            'issues-mobile-visual.png':'6f6f74a244d48bec0dadf34548bad792ae81fb17df8f89931d17d78d774ad35c',
            'create-issue-visual.png':'02bb349d38e63b9b9c4d9ecbd330d1f4b075893345b3c358304371c7ca4c3e8f'
          };
          const baseline='tests/e2e/__screenshots__/visual.spec.ts';
          mkdirSync(baseline,{recursive:true}); mkdirSync('docs/screenshots',{recursive:true});
          for(const [name,digest] of Object.entries(sha256)) {
            const bytes=readFileSync(`${root}/${baseline}/${name}`);
            if(bytes.length>1000000 || bytes.subarray(0,8).toString('hex')!=='89504e470d0a1a0a' || createHash('sha256').update(bytes).digest('hex')!==digest) throw new Error(`Image mismatch: ${name}`);
            writeFileSync(`${baseline}/${name}`,bytes);
            writeFileSync(`docs/screenshots/${name}`,bytes);
          }
          writeFileSync('docs/screenshots/provenance.json',JSON.stringify({sourceCommit,runId:34500249422,artifactId:10161566659,capturedAt:'2026-09-10',data:'Synthetic local demo workspace; no production data',review:'All five captured images visually inspected before approval. Initial generation is not a regression comparison.',initialChecks:{e2e:'4 passed',quality:'passed',storybookBuild:'passed',storybookInteractions:'failed before collecting tests; separate configuration fix',postgres:'container setup failed; separate quoting fix'},sha256},null,2)+'\n');
          JS
      - name: Commit screenshots and visual baselines together
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots tests/e2e/__screenshots__
          if ! git diff --cached --quiet; then
            git commit -m 'test(visual): approve five reviewed React screenshots and regression baselines'
            git push origin HEAD:main
          fi
