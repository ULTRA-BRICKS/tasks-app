name: Publish recovered application source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-source.yml', '.github/source-commits.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-application-source
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'alex-mextner/tickets-app'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Apply integrity-checked local commits without force pushes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/publish-tickets-source.mjs <<'JS'
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { writeFileSync, readFileSync } from 'node:fs';
          function run(...args) {
            const r = Bun.spawnSync(args, { stdout: 'pipe', stderr: 'pipe' });
            if (r.exitCode) throw new Error(`${args[0]} failed: ${r.stderr.toString()}`);
            return r.stdout.toString().trim();
          }
          const git = (...args) => run('git', ...args);
          const hash = b => createHash('sha1').update(`blob ${b.length}\0`).update(b).digest('hex');
          const allowed = path => /^(packages\/|src\/|api\/|tokens\/|public\/|tests\/|scripts\/|docs\/|\.storybook\/|\.agents\/|DESIGN\.md$|README\.md$|LICENSE$|index\.html$|components\.json$|vite\.config\.ts$|vitest\.config\.ts$|playwright\.config\.ts$|tsconfig\.json$|package\.json$|vercel\.json$|\.gitignore$|\.oxlintrc\.json$|\.oxfmtrc\.json$|\.env\.example$)/.test(path) && !path.includes('..') && !path.includes('\\') && !/\.(zip|tar|gz|db|sqlite|woff2?|ttf|otf)$/.test(path);
          git('config', 'user.name', 'github-actions[bot]');
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com');
          const groups = JSON.parse(readFileSync('.github/source-commits.json', 'utf8'));
          for (const group of groups) {
            if (git('log', '--format=%s').split('\n').includes(group.message)) continue;
            if (!/^[a-f0-9]{40}$/.test(group.patchBlob ?? '')) throw new Error('Unpublished legacy recovery group; refusing to guess');
            const response = await fetch(`https://api.github.com/repos/alex-mextner/tickets-app/git/blobs/${group.patchBlob}`, {
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
            });
            if (!response.ok) throw new Error(`Patch fetch failed: ${response.status}`);
            const blob = await response.json();
            const bytes = Buffer.from(blob.content, 'base64');
            if (bytes.length > 1000000 || hash(bytes) !== group.patchBlob) throw new Error('Patch blob integrity mismatch');
            const patch = brotliDecompressSync(bytes, { maxOutputLength: 4000000 });
            if (createHash('sha256').update(patch).digest('hex') !== group.patchSHA256) throw new Error('Patch digest mismatch');
            const text = patch.toString('utf8');
            if (/^(?:new file mode|new mode) (?!100644$)/m.test(text) || /^(?:GIT binary patch|rename from|rename to)/m.test(text)) throw new Error('Only plain source changes are accepted');
            writeFileSync('/tmp/tickets-source.patch', patch);
            const paths = git('apply', '--numstat', '/tmp/tickets-source.patch').split('\n').filter(Boolean).map(line => line.split('\t')[2]);
            if (!paths.length || paths.some(p => !allowed(p))) throw new Error('Disallowed patch paths');
            git('apply', '--check', '--index', '/tmp/tickets-source.patch');
            git('apply', '--index', '/tmp/tickets-source.patch');
            if (group.generated) {
              run('bun', 'install', '--frozen-lockfile');
              run('bun', 'run', 'prepare:generated');
              for (const [path, sha] of Object.entries(group.generated)) {
                if (!allowed(path) || git('hash-object', path) !== sha) throw new Error(`Generated output mismatch: ${path}`);
                git('add', '--', path);
              }
            }
            git('commit', '-m', group.message);
            git('push', 'origin', 'HEAD:main');
            console.log(`${git('rev-parse', '--short', 'HEAD')} ${group.message} (${paths.length} changed source files)`);
          }
          JS
          bun /tmp/publish-tickets-source.mjs
