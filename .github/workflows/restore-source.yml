name: Publish recovered application source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-source.yml', '.github/source-commits.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-application-source
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'alex-mextner/tickets-app'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Materialize reviewed source and commit each independent module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/publish-tickets-source.mjs <<'JS'
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { mkdirSync, writeFileSync, readFileSync } from 'node:fs';
          import { dirname } from 'node:path';
          function git(...args) {
            const result = Bun.spawnSync(['git', ...args], { stdout: 'pipe', stderr: 'pipe' });
            if (result.exitCode) throw new Error(`git ${args[0]} failed: ${result.stderr.toString()}`);
            return result.stdout.toString().trim();
          }
          git('config', 'user.name', 'github-actions[bot]');
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com');
          const groups = JSON.parse(readFileSync('.github/source-commits.json', 'utf8'));
          for (const group of groups) {
            if (git('log', '--format=%s').split('\n').includes(group.message)) continue;
            const files = {};
            for (const sha of group.blobs) {
              if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid source object');
              const response = await fetch(`https://api.github.com/repos/alex-mextner/tickets-app/git/blobs/${sha}`, {
                headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
              });
              if (!response.ok) throw new Error(`Source fetch failed: ${response.status}`);
              const blob = await response.json();
              const bytes = Buffer.from(blob.content, 'base64');
              const actual = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
              if (actual !== sha || bytes.length > 1000000) throw new Error('Source object integrity mismatch');
              const source = JSON.parse(brotliDecompressSync(bytes, { maxOutputLength: 4000000 }));
              if (!source.files) throw new Error('Invalid manifest');
              for (const [path, content] of Object.entries(source.files)) {
                if (path in files) throw new Error(`Duplicate path: ${path}`);
                files[path] = content;
              }
            }
            const paths = Object.keys(files);
            for (const path of paths) {
              if (!/^(packages\/|src\/|api\/|tokens\/|public\/|tests\/|scripts\/|docs\/|\.storybook\/|\.agents\/|DESIGN\.md$|LICENSE$|index\.html$|components\.json$|vite\.config\.ts$|vitest\.config\.ts$|playwright\.config\.ts$|tsconfig\.json$|package\.json$|\.oxlintrc\.json$|\.oxfmtrc\.json$|\.env\.example$)/.test(path) || path.includes('..') || path.includes('\\') || /\.(zip|tar|gz|db|sqlite|woff2?|ttf|otf)$/.test(path)) throw new Error(`Disallowed source path: ${path}`);
              if (typeof files[path] !== 'string') throw new Error('Non-text source');
              mkdirSync(dirname(path), { recursive: true });
              writeFileSync(path, files[path]);
            }
            git('add', '--', ...paths);
            if (!git('diff', '--cached', '--name-only')) continue;
            git('commit', '-m', group.message);
            git('push', 'origin', 'HEAD:main');
            console.log(`${git('rev-parse', '--short', 'HEAD')} ${group.message} (${paths.length} files)`);
          }
          JS
          bun /tmp/publish-tickets-source.mjs
