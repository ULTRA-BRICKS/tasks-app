name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: true
  DO_NOT_TRACK: 1
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the source once, before parallel jobs
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          printf 'All verification jobs test commit `%s`.\n' "$sha" >> "$GITHUB_STEP_SUMMARY"
  quality:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run tokens:check && bun run api:check && bun run graphql:check
      - run: bun run check
      - run: bun run typecheck:tsc
      - run: bun run check:secrets
      - name: Check owned source formatting
        run: bun x --no-install oxfmt --check src packages scripts tests tokens .storybook playwright.config.ts
      - name: Verify generators did not change tracked files
        run: git diff --exit-code
  postgres:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tickets
          POSTGRES_PASSWORD: tickets
          POSTGRES_DB: tickets_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tickets -d tickets_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://tickets:tickets@127.0.0.1:5432/tickets_test
  browser:
    needs: source
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun x --no-install playwright install --with-deps chromium webkit
      - run: bun run storybook:build
      - name: Storybook interactions and accessibility
        id: storybook
        run: bun run test:ui
      - name: Browser end-to-end scenarios
        id: e2e
        if: ${{ !cancelled() }}
        run: bun run test:e2e
      - name: Compare reviewed visual baselines
        id: visual
        if: ${{ !cancelled() && hashFiles('tests/e2e/__screenshots__/linux/**/*.png') != '' }}
        run: bun run test:visual
      - name: Capture initial visual candidates for review
        if: ${{ !cancelled() && hashFiles('tests/e2e/__screenshots__/linux/**/*.png') == '' }}
        run: bun run screenshots
      - name: Record exact tested source
        if: always()
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/TESTED_SHA
          printf 'storybook=%s\ne2e=%s\nvisual=%s\n' '${{ steps.storybook.outcome }}' '${{ steps.e2e.outcome }}' '${{ steps.visual.outcome }}' > reports/RESULTS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            tests/e2e/__screenshots__/
            playwright-report/
            test-results/
            reports/
          retention-days: 7
